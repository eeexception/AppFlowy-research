name: appflowy_sdk
description: Official AppFlowy SDK for Flutter/Dart - Build applications using AppFlowy as a data layer
version: 1.0.0-alpha
homepage: https://github.com/AppFlowy-IO/AppFlowy-SDK
repository: https://github.com/AppFlowy-IO/AppFlowy-SDK
issue_tracker: https://github.com/AppFlowy-IO/AppFlowy-SDK/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  dio: ^5.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  meta: ^1.10.0

dev_dependencies:
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  test: ^1.24.9
  mocktail: ^1.0.3

topics:
  - appflowy
  - sdk
  - api-client
  - collaboration
  - database
